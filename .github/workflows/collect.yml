name: collect

on:
  schedule:
    # UTC。JST = UTC+9。毎日動かす (レースの無い日は一覧が空で 1 リクエストで終わる)
    - cron: "30 23 * * *"   # morning   JST 08:30
    - cron: "45 23 * * *"   # morning   JST 08:45 (予備)
    # afternoon は午前の --until 14:20 より前に起動させ、concurrency group で待たせる
    # (cron が遅れても、午前が終わった瞬間に午後が始まる = 引き継ぎに隙間ができない)
    - cron: "40 4 * * *"    # afternoon JST 13:40
    - cron: "55 4 * * *"    # afternoon JST 13:55 (予備)
  workflow_dispatch:
    inputs:
      mode:
        description: "morning / afternoon / once / synctest (データ repo への書き込み確認、netkeiba には触らない)"
        type: choice
        options: [morning, afternoon, once, synctest]
        default: once
      date:
        description: "YYYYMMDD (空なら今日、JST)"
        required: false
        default: ""
      race_id:
        description: "once 用の race_id (12 桁)"
        required: false
        default: "202605040611"

# 収集ジョブは午前・午後とも 1 本の列に並べる (同時に 2 つの収集器を動かさない = 並列なし)。
# GitHub の規則: 1 group に running 1 本 + pending 1 本まで。新しい pending は古い pending をキャンセルする。
# 午後の cron (13:40 / 13:55) は午前 (〜14:20) の実行中に pending になり、残っていた午前の予備 pending を置き換え、
# 午前が 14:20 に終わるとすぐ始まる (13:55 の予備が来れば 13:40 の pending と入れ替わるだけで、どちらも afternoon)。
# 午前が早く終わっていれば午後はそのまま始まり 17:45 まで動く。--until を過ぎてから始まった実行は一覧を 1 回取ってすぐ終わる。
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'once') && format('once-{0}', github.run_id) || 'collect' }}
  cancel-in-progress: false

# この公開 repo には書かない。データは非公開 repo seiji629/keiba-odds-data に deploy key (secret DATA_DEPLOY_KEY) で push する
# (netkeiba 利用規約: 不特定多数が閲覧できる場所に置かない)。artifact も公開 repo では誰でも落とせるので作らない。
permissions:
  contents: read

env:
  TZ: Asia/Tokyo

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: checkout data repo (非公開)
        if: github.event_name == 'schedule' || inputs.mode != 'once'
        uses: actions/checkout@v4
        with:
          repository: seiji629/keiba-odds-data
          path: datarepo
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          persist-credentials: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: decide mode
        id: cfg
        env:
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
          IN_MODE: ${{ inputs.mode }}
          IN_DATE: ${{ inputs.date }}
          IN_RACE: ${{ inputs.race_id }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            case "$SCHED" in
              "30 23 * * *"|"45 23 * * *") MODE=morning ;;
              "40 4 * * *"|"55 4 * * *")   MODE=afternoon ;;
              *) # 知らない cron 文字列: JST の起動時刻で決める (13:30 以後なら午後)
                 if [ "$(date +%H%M)" -ge 1330 ]; then MODE=afternoon; else MODE=morning; fi ;;
            esac
          else
            MODE="$IN_MODE"
          fi
          D="${IN_DATE:-$(date +%Y%m%d)}"
          [[ "$D" =~ ^[0-9]{8}$ ]] || { echo "bad date: $D"; exit 1; }
          case "$MODE" in
            morning)   UNTIL=14:20 ;;
            afternoon) UNTIL=17:45 ;;
            once)      UNTIL= ; [[ "$IN_RACE" =~ ^[0-9]{12}$ ]] || { echo "bad race_id: $IN_RACE"; exit 1; } ;;
            synctest)  UNTIL= ;;
            *) echo "bad mode: $MODE"; exit 1 ;;
          esac
          echo "mode=$MODE date=$D until=$UNTIL now=$(date '+%F %T %Z')"
          { echo "mode=$MODE"; echo "date=$D"; echo "until=$UNTIL"; echo "race_id=$IN_RACE"; } >> "$GITHUB_OUTPUT"
          if [ -d datarepo/.git ]; then
            git -C datarepo config user.name seiji629
            git -C datarepo config user.email seiji629@users.noreply.github.com
          fi

      - name: once (1 レースの現在値を表示するだけ、書き込みなし)
        if: steps.cfg.outputs.mode == 'once'
        env:
          RID: ${{ steps.cfg.outputs.race_id }}
        run: |
          curl -s --max-time 10 https://ipinfo.io/json | python3 -c 'import json,sys; j=json.load(sys.stdin); print("runner:", j.get("ip"), j.get("city"), j.get("region"), j.get("country"), j.get("org"))' || echo "runner: (ipinfo 失敗)"
          start=$(date +%s.%N)
          python3 odds_collector.py --once "$RID" --place
          echo "wall: $(python3 -c "print(round($(date +%s.%N) - $start, 2))") s"

      - name: collect (30 分ごとに途中 push)
        if: steps.cfg.outputs.mode == 'morning' || steps.cfg.outputs.mode == 'afternoon'
        timeout-minutes: 350
        env:
          MODE: ${{ steps.cfg.outputs.mode }}
          D: ${{ steps.cfg.outputs.date }}
          UNTIL: ${{ steps.cfg.outputs.until }}
        run: |
          W="$RUNNER_TEMP/work"
          mkdir -p "$W/data/odds_ts"
          cp odds_collector.py "$W/"
          # 同じ日の既存ファイルを引き継ぐ (収集器は追記し、last_official で続きから取る)
          cp datarepo/data/odds_ts/${D}_*.csv datarepo/data/odds_ts/collector.log "$W/data/odds_ts/" 2>/dev/null || true
          python3 "$W/odds_collector.py" --date "$D" --place --until "$UNTIL" &
          PID=$!
          last=$SECONDS
          while kill -0 "$PID" 2>/dev/null; do
            sleep 30
            if (( SECONDS - last >= 1800 )); then
              python3 scripts/sync_odds.py "$W/data/odds_ts" datarepo/data/odds_ts "$D" "odds_ts $D $MODE (途中)" || true
              last=$SECONDS
            fi
          done
          wait "$PID"

      - name: commit + push (失敗・中断でも)
        if: always() && (steps.cfg.outputs.mode == 'morning' || steps.cfg.outputs.mode == 'afternoon')
        env:
          MODE: ${{ steps.cfg.outputs.mode }}
          D: ${{ steps.cfg.outputs.date }}
        run: python3 scripts/sync_odds.py "$RUNNER_TEMP/work/data/odds_ts" datarepo/data/odds_ts "$D" "odds_ts $D $MODE"

      - name: synctest (印のファイルを sync_odds.py で push し、確認後に消す。netkeiba へのリクエストなし)
        if: steps.cfg.outputs.mode == 'synctest'
        run: |
          W="$RUNNER_TEMP/synctest"
          mkdir -p "$W"
          printf 'synctest,run_id,at\nsynctest,%s,%s\n' "$GITHUB_RUN_ID" "$(date '+%F %T %Z')" > "$W/00000000_races.csv"
          python3 scripts/sync_odds.py "$W" datarepo/synctest 00000000 "synctest $GITHUB_RUN_ID"
          git -C datarepo log -1 --format='pushed: %H %s'
          git -C datarepo ls-remote origin refs/heads/main
          git -C datarepo rm -q -r synctest
          git -C datarepo commit -q -m "synctest $GITHUB_RUN_ID: 印を消す"
          git -C datarepo push -q origin HEAD:main
          git -C datarepo log -2 --format='%H %s'
          git -C datarepo ls-remote origin refs/heads/main
